name: E2E Voice & Text Testing
#Workflow to run tests Test 1
on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        working-directory: sample_testing/e2e-voice-text-harness
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML httpx websockets python-dotenv
          
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Maestro CLI
        run: |
          if ! command -v maestro >/dev/null 2>&1; then
            curl -fsSL "https://get.maestro.mobile.dev" | bash
            echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          fi
      
      - name: Select available iPhone simulator
        id: select-sim
        run: |
          SIM_OUTPUT=$(python - <<'PY'
          import json
          import subprocess
          import sys
          import uuid

          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]).decode())
          runtime_candidates = [
              rt for rt in runtimes.get("runtimes", [])
              if rt.get("isAvailable") and rt.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")
          ]
          if not runtime_candidates:
              raise SystemExit("No available iOS runtime found")
          runtime = sorted(runtime_candidates, key=lambda rt: rt.get("version", ""), reverse=True)[0]

          devicetypes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]).decode())
          device_candidates = [
              dt for dt in devicetypes.get("devicetypes", [])
              if "iPhone" in dt.get("name", "") and dt.get("identifier", "").startswith("com.apple.CoreSimulator.SimDeviceType.")
          ]
          if not device_candidates:
              raise SystemExit("No iPhone device type found")
          preferred = [dt for dt in device_candidates if dt.get("name") == "iPhone 16"]
          device_type = preferred[0] if preferred else sorted(device_candidates, key=lambda dt: dt.get("name", ""), reverse=True)[0]

          sim_name = f"e2e-{uuid.uuid4().hex[:8]}"
          sim_udid = subprocess.check_output([
              "xcrun", "simctl", "create", sim_name, device_type["identifier"], runtime["identifier"]
          ]).decode().strip()
          print(f"SIM_NAME={sim_name}")
          print(f"SIM_UDID={sim_udid}")
          PY
          )
          echo "$SIM_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Boot Simulator
        run: |
          SIM_UDID="${{ steps.select-sim.outputs.SIM_UDID }}"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
     
      - name: Build iOS app
        working-directory: sample_testing/e2e-voice-text-harness/App
        run: |
          xcodebuild build \
            -scheme VoiceTextDemo \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.select-sim.outputs.SIM_UDID }}" \
            -derivedDataPath build

          xcodebuild \
            -scheme VoiceTextDemo \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.select-sim.outputs.SIM_UDID }}" \
            -derivedDataPath build \
            -showBuildSettings > build-settings.txt

      - name: Install app on simulator
        working-directory: sample_testing/e2e-voice-text-harness/App
        run: |
          APP_PATH=$(python - <<'PY'
          from pathlib import Path
          import re
          import sys

          def parse_settings(path: Path) -> dict[str, str]:
              settings = {}
              if not path.exists():
                  return settings
              for line in path.read_text().splitlines():
                  match = re.match(r"\s*([A-Za-z0-9_]+)\s*=\s*(.*)", line)
                  if match:
                      settings[match.group(1)] = match.group(2).strip()
              return settings

          def unique_candidates(paths):
              seen = set()
              for path in paths:
                  if path is None:
                      continue
                  path = Path(path)
                  if path in seen:
                      continue
                  seen.add(path)
                  yield path

          settings = parse_settings(Path("build-settings.txt"))
          search_roots = [
              Path(settings.get("TARGET_BUILD_DIR", "")),
              Path(settings.get("BUILT_PRODUCTS_DIR", "")),
              Path("build"),
              Path(".build"),
              Path.home() / "Library/Developer/Xcode/DerivedData",
          ]

          preferred = []
          wrapper_name = settings.get("WRAPPER_NAME")
          executable_path = settings.get("EXECUTABLE_PATH")
          executable_name = settings.get("EXECUTABLE_NAME", "VoiceTextDemo")
          if search_roots[0].exists() and wrapper_name:
              preferred.append(search_roots[0] / wrapper_name)
          if search_roots[1].exists() and wrapper_name:
              preferred.append(search_roots[1] / wrapper_name)
          if search_roots[0].exists() and executable_path:
              preferred.append(search_roots[0] / executable_path)
          if search_roots[1].exists() and executable_path:
              preferred.append(search_roots[1] / executable_path)
          if search_roots[0].exists():
              preferred.append(search_roots[0] / executable_name)
          if search_roots[1].exists():
              preferred.append(search_roots[1] / executable_name)

          for candidate in unique_candidates(preferred):
              if candidate.is_dir() and candidate.name.endswith(".app"):
                  print(candidate)
                  sys.exit(0)
              if candidate.is_file():
                  print(candidate)
                  sys.exit(0)

          for root in search_roots[2:]:
              if not root.exists():
                  continue
              for candidate in root.rglob("VoiceTextDemo.app"):
                  if candidate.is_dir():
                      print(candidate)
                      sys.exit(0)
              for candidate in root.rglob("VoiceTextDemo"):
                  if candidate.is_file():
                      print(candidate)
                      sys.exit(0)
          PY
          )

          if [ -z "$APP_PATH" ]; then
            echo "Unable to find built app bundle or executable"
            find build .build "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 5 2>/dev/null | sed -n '1,200p'
            exit 1
          fi

          if [ -d "$APP_PATH" ] && [[ "$APP_PATH" == *.app ]]; then
            xcrun simctl install "${{ steps.select-sim.outputs.SIM_UDID }}" "$APP_PATH"
            exit 0
          fi

          APP_BUNDLE=build/VoiceTextDemo.app
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE"
          cp "$APP_PATH" "$APP_BUNDLE/VoiceTextDemo"
          chmod +x "$APP_BUNDLE/VoiceTextDemo"
          cat > "$APP_BUNDLE/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>VoiceTextDemo</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.VoiceTextDemo</string>
            <key>CFBundleName</key>
            <string>VoiceTextDemo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcrun simctl install "${{ steps.select-sim.outputs.SIM_UDID }}" "$APP_BUNDLE"

      - name: Run Tests
        working-directory: sample_testing/e2e-voice-text-harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-7b-it:free
          PYTHONPATH: ${{ github.workspace }}
          IOS_SIMULATOR: ${{ steps.select-sim.outputs.SIM_NAME }}
          IOS_SIMULATOR_UDID: ${{ steps.select-sim.outputs.SIM_UDID }}
          APP_BUNDLE_ID: com.example.VoiceTextDemo
        run: |
          python harness/runner/run_tests.py --suite smoke

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: sample_testing/e2e-voice-text-harness/reports/
